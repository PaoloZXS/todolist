<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todos - Cose da Fare</title>
    <link rel="manifest" href="../manifest.json" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="todos.css" />
    <meta name="theme-color" content="#293248" />
  </head>
  <body class="todos-shell">
    <main class="center-shell">
      <section class="card card-compact todo-card">
        <header class="header-row todo-header">
          <div>
            <p class="eyebrow">To-Do List</p>
          </div>
          <div class="user-menu-wrapper">
            <button id="userMenuBtn" class="user-menu-btn" title="Menu utente">
              <svg class="user-icon" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="8" r="4" />
                <path d="M12 14c-4 0-6 2-6 2v3h12v-3s-2-2-6-2z" />
              </svg>
              <span id="userGreeting">Ciao, utente</span>
              <svg
                class="dropdown-arrow"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div id="userMenu" class="user-menu hidden">
              <button id="logoutBtn" class="menu-item">Esci</button>
            </div>
          </div>
        </header>
        <div class="card-actions">
          <button id="addTodoBtn" class="button button-primary">
            + Aggiungi Cosa da Fare
          </button>
          <button id="installBtn" class="button button-secondary hidden">
            📲 Scarica App
          </button>
        </div>
        <div class="todo-grid">
          <div class="todo-row section-label section-pending">
            Attivita' da fare
          </div>
          <div class="todo-row header">
            <span>Data</span>
            <span>Cosa da Fare</span>
            <span>Utente</span>
            <span>Azioni</span>
          </div>
          <div id="todosContainer"></div>
        </div>
      </section>
    </main>

    <div id="todoFormOverlay" class="overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h2 class="modal-title" id="modalTitle">Nuova attività</h2>
        </div>
        <form id="todoForm">
          <label>
            Descrizione
            <input
              id="todoText"
              type="text"
              required
              maxlength="120"
              placeholder="Esempio: Preparare report settimanale"
            />
          </label>
          <div class="form-actions">
            <button
              type="button"
              id="cancelBtn"
              class="button button-secondary"
            >
              Annulla
            </button>
            <button type="submit" class="button button-primary">Salva</button>
          </div>
          <input type="hidden" id="todoId" />
        </form>
      </div>
    </div>

    <script type="module" src="todos.js"></script>
  </body>
</html>
